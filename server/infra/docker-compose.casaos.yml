name: linky-dashboard

services:
  linky-dashboard:
    image: ghcr.io/moifort/dashboard:main
    container_name: linky-dashboard
    restart: unless-stopped
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: 1m
    ports:
      - target: 5000
        published: "5000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/linky-dashboard
        target: /data
    environment:
      TZ: Europe/Paris
      LINKY_TOKEN: changeme
      LINKY_PRM: changeme
      HC_WINDOWS: "23:32-5:32,15:02-17:02"
      PRICE_HP: "0.2065"
      PRICE_HC: "0.1579"
      PRICE_ABO_MONTHLY: "15.65"
      # Screen-refresh schedule — SCREEN_REFRESH_INTERVAL_MIN must match the
      # firmware's REFRESH_INTERVAL_MIN; server renders DATA_LEAD_MIN before each wake.
      # SCREEN_WAKE_SKIP_MIN mirrors the firmware's "skip a boundary within N min"
      # guard so the Home panel's next-refresh time matches the real next wake.
      SCREEN_REFRESH_INTERVAL_MIN: "120"
      DATA_LEAD_MIN: "10"
      SCREEN_WAKE_SKIP_MIN: "5"
      # Optional EcoFlow PowerStream solar production — leave empty to disable.
      ECOFLOW_EMAIL: ""
      ECOFLOW_PASSWORD: ""
      ECOFLOW_DEVICE_SN: ""
      ECOFLOW_API_HOST: api-e.ecoflow.com
      # Optional crypto-bot stats panel (top-right) — leave URL empty to disable.
      CRYPTO_API_URL: ""
      CRYPTO_API_TOKEN: ""
      # Optional shared local MQTT broker for the Z2M/ESPHome slices (cumulus,
      # washer, water) — leave MQTT_HOST empty to disable all of them. Use the
      # broker's LAN IP (bridge network). EcoFlow's cloud broker is separate.
      MQTT_HOST: ""
      MQTT_PORT: "1883"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      # Each Z2M/ESPHome slice only sets its own topic (enabled with MQTT_HOST above).
      # Cumulus (water-heater) daily kWh; leave empty to disable this one.
      CUMULUS_TOPIC: zigbee2mqtt/cumulus
      # Washing machine (lave-linge) daily kWh; leave empty to disable this one.
      WASHER_TOPIC: zigbee2mqtt/washing_machine
      # Optional UniFi network panel (bottom-right) — set the password to enable.
      # Use the gateway's LAN IP (bridge network can't use localhost).
      UNIFI_HOST: https://192.168.1.1
      UNIFI_USERNAME: ""
      UNIFI_PASSWORD: ""
      UNIFI_SITE: default
      UNIFI_SSID_IOT: ""
      UNIFI_SSID_MAIN: ""
      # Optional water meter daily consumption ("Eau" chart, center column) via an
      # ESPHome wM-Bus reader publishing the cumulative index (m³) over MQTT —
      # leave the topic empty to disable this one.
      WATER_TOPIC: watermeter/index_m3
      WATER_PRICE_M3: "0"
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/status')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    network_mode: bridge
    labels:
      icon: https://raw.githubusercontent.com/moifort/dashboard/main/server/scripts/preview.png

x-casaos:
  author: moifort
  category: Utilities
  icon: https://raw.githubusercontent.com/moifort/dashboard/main/server/scripts/preview.png
  index: /
  port_map: "5000"
  scheme: http
  store_app_id: linky-dashboard
  title:
    en_us: Linky Dashboard
